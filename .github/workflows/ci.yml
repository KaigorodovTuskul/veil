name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run self-test
        run: uv run python anonymize.py --self-test

      - name: Compile sources
        run: uv run python -m py_compile anonymize.py extractors.py i18n.py

      - name: Build portable package
        shell: powershell
        run: .\build_portable.ps1

      - name: Create ZIP archive
        shell: powershell
        run: Compress-Archive -Path dist\anonymizer\* -DestinationPath dist\Veil-windows-x64.zip -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veil-windows-x64
          path: dist/Veil-windows-x64.zip
